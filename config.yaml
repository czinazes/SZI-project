# =============================================================================
# Real-Time Face Analysis System — Configuration
# =============================================================================

# Task: "emotion" (FER2013) or "mask" (Face Mask Detection)
task: "emotion"

# --- Data ---
data:
  raw_dir: "data/raw"
  processed_dir: "data/processed"
  train_dir: "data/processed/train"
  val_dir: "data/processed/val"
  test_dir: "data/processed/test"
  val_split: 0.2          # fraction of training data used for validation

# --- Image ---
image:
  size: 48                # input image size (48x48 for FER2013, 128x128 for mask)
  channels: 1             # 1 = grayscale, 3 = RGB
  color_mode: "grayscale" # "grayscale" or "rgb"

# --- Model ---
model:
  architecture: "custom_cnn"   # "custom_cnn" or "mobilenet_transfer"
  num_classes: 7               # 7 for FER2013 emotions, 2 for mask detection
  class_names:
    - "Angry"
    - "Disgust"
    - "Fear"
    - "Happy"
    - "Sad"
    - "Surprise"
    - "Neutral"

# --- Training ---
training:
  epochs: 50
  batch_size: 32
  learning_rate: 0.001
  optimizer: "adam"
  early_stopping_patience: 10
  reduce_lr_patience: 5
  reduce_lr_factor: 0.5

# --- Augmentation ---
augmentation:
  rotation_range: 15
  width_shift_range: 0.1
  height_shift_range: 0.1
  horizontal_flip: true
  zoom_range: 0.1
  brightness_range: [0.9, 1.1]

# --- Paths ---
paths:
  model_save: "models/best_model.keras"
  training_history_plot: "outputs/training_history.png"
  confusion_matrix_plot: "outputs/confusion_matrix.png"

# --- Camera ---
camera:
  index: 0               # webcam device index (0 = default)
  frame_width: 640
  frame_height: 480
  cascade_path: null      # null = use OpenCV default haarcascade_frontalface
  min_face_size: 30       # minimum face size in pixels
  detection_scale: 1.3    # scaleFactor for detectMultiScale
  min_neighbors: 5        # minNeighbors for detectMultiScale

# --- UI Overlay ---
overlay:
  box_color_positive: [0, 255, 0]    # green (BGR)
  box_color_negative: [0, 0, 255]    # red (BGR)
  box_thickness: 2
  font_scale: 0.8
  show_confidence: true
  show_fps: true
